<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="650" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&amp;family=Poppins:wght@700&amp;display=swap');
      .logo-title {
        font-family: 'Playfair Display', Georgia, 'Times New Roman', serif;
        font-weight: 900;
        font-size: 40px;
        letter-spacing: 2px;
        fill: #0F4C81;
      }
      .logo-tagline {
        font-family: 'Poppins', 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 4.5px;
        fill: #17A2B8;
      }
    </style>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#0B3A63"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17A2B8"/>
      <stop offset="100%" stop-color="#138496"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C430"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- Left Emblem Graphics (100% Vector Geometry) -->
  <g transform="translate(15, 15)">
    <!-- Outer Shield/Oval Ring -->
    <ellipse cx="80" cy="85" rx="72" ry="80" fill="none" stroke="url(#blueGrad)" stroke-width="7"/>
    <ellipse cx="80" cy="85" rx="63" ry="71" fill="url(#blueGrad)"/>

    <!-- Gold Star Orbit Swoosh -->
    <path d="M 140,40 C 160,15 135,80 145,130" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <!-- 5-Point Star -->
    <polygon points="145,22 148,31 157,32 150,38 152,47 145,42 138,47 140,38 133,32 142,31" fill="url(#goldGrad)"/>

    <!-- Doctor & Family Silhouettes (White Vectors) -->
    <!-- Doctor Figure -->
    <circle cx="62" cy="58" r="15" fill="#FFFFFF"/>
    <path d="M 40,118 C 40,88 50,80 62,80 C 74,80 84,88 84,118 Z" fill="#FFFFFF"/>
    <!-- Cross Badge on Chest -->
    <path d="M 59,92 H 65 V 104 H 59 Z M 56,95 H 68 V 101 H 56 Z" fill="#0F4C81"/>

    <!-- Child / Family Figure -->
    <circle cx="98" cy="70" r="12" fill="#FFFFFF"/>
    <path d="M 82,118 C 82,95 90,88 98,88 C 106,88 114,95 114,118 Z" fill="#FFFFFF"/>
  </g>

  <!-- Right Typography & Underline Vector Shapes -->
  <g transform="translate(185, 25)">
    <!-- "THE DENTAL CLINICS" Header Vector Text -->
    <text x="0" y="82" class="logo-title">
      THE DENTAL CLINICS
    </text>

    <!-- Tagline Vector Text -->
    <text x="4" y="116" class="logo-tagline">
      MULTI-SPECIALITY DENTAL CARE
    </text>

    <!-- Teal Dynamic Underline Vector Path -->
    <path d="M 0,132 C 130,142 280,140 425,130" fill="none" stroke="url(#tealGrad)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>